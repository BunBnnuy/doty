<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@doty/avatar — demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #292929;
        --panel: #303033;
        --line: #3b3b45;
        --text: #e8e8f2;
        --muted: #9a9ab0;
        --accent: #efedf1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .app { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }
      h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.2px; }
      .sub { color: var(--muted); margin: 0 0 22px; }
      .layout { display: grid; grid-template-columns: 320px 1fr; gap: 22px; align-items: start; }
      @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
      .stage {
        display: grid; place-items: center; gap: 14px;
        padding: 26px; border: 1px solid var(--line); border-radius: 18px;
        background: var(--bg);
      }
      .caption { color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
      .caption strong { color: var(--text); font-weight: 600; }
      .small-mount { display: flex; align-items: center; gap: 20px; }
      .stage .sub { margin: 0; text-align: center; }
      .poses { margin-top: 32px; }
      .poses h2 { font-size: 16px; }
      .pose-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
      button.pose { display: grid; justify-items: center; gap: 4px; border-radius: 12px; padding: 12px 4px; font-size: 11px; background: var(--bg); }
      .pose .sub { margin: 0; }
      .controls { display: grid; gap: 16px; }
      .group { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; background: var(--panel); }
      .group h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 0 0 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button {
        font: inherit; color: var(--text); background: #20202e; border: 1px solid var(--line);
        border-radius: 999px; padding: 5px 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s;
      }
      button:hover { border-color: var(--accent); }
      button.active { background: var(--accent); border-color: var(--accent); color: #12061f; font-weight: 600; }
      label.control { display: grid; grid-template-columns: 90px 1fr 54px; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); }
      input[type="range"], select, input[type="text"] {
        font: inherit; color: var(--text); background: #20202e; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px;
      }
      input[type="range"] { padding: 0; }
      .check { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
      pre { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #101018; color: #c9c9e0; overflow: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
