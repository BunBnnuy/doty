<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Doty</title>
    <style>
      :root {
        --dot-size: 140px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #app {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      /* PLACEHOLDER dot. @doty/avatar replaces this in Wave 2. Its only job
         right now is to visibly reflect DotState via data-activity. */
      .dot {
        width: var(--dot-size);
        height: var(--dot-size);
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #8f86ff 0%,
          #6c5cff 45%,
          #3b2fd6 100%
        );
        box-shadow:
          0 0 40px rgba(108, 92, 255, 0.55),
          inset 0 0 30px rgba(255, 255, 255, 0.18);
        transition:
          transform 320ms ease,
          filter 320ms ease,
          box-shadow 320ms ease,
          opacity 320ms ease;
        will-change: transform, filter;
        animation: breathe 3.2s ease-in-out infinite;
      }

      /* Activity is the primary axis. Each state gets a distinct motion. */
      .dot[data-activity="idle"] {
        transform: scale(0.86);
        filter: saturate(0.8);
      }
      .dot[data-activity="listening"] {
        transform: scale(1);
        box-shadow:
          0 0 60px rgba(108, 92, 255, 0.75),
          inset 0 0 30px rgba(255, 255, 255, 0.25);
      }
      .dot[data-activity="thinking"] {
        animation: spin-pulse 1.8s ease-in-out infinite;
      }
      .dot[data-activity="working"] {
        animation: spin-pulse 1.1s ease-in-out infinite;
      }
      .dot[data-activity="speaking"] {
        animation: speak 420ms ease-in-out infinite;
      }
      .dot[data-activity="waiting_approval"] {
        animation: nudge 1.4s ease-in-out infinite;
      }
      .dot[data-activity="done"] {
        filter: saturate(1.3) brightness(1.15);
      }
      .dot[data-activity="error"] {
        background: radial-gradient(
          circle at 35% 30%,
          #ff9a8f 0%,
          #f2544b 45%,
          #b3241d 100%
        );
      }

      /* Emotion is a secondary, independent tint on top of activity. */
      .dot[data-emotion="happy"] {
        filter: hue-rotate(28deg) saturate(1.2);
      }
      .dot[data-emotion="curious"] {
        filter: hue-rotate(-24deg) saturate(1.1);
      }
      .dot[data-emotion="concerned"] {
        filter: hue-rotate(150deg) saturate(0.9);
      }
      .dot[data-emotion="focused"] {
        filter: saturate(1.35) contrast(1.05);
      }

      /* Connection is client-owned: visibly degrade when the brain is gone. */
      .dot[data-connection="reconnecting"] {
        opacity: 0.72;
        filter: grayscale(0.35);
      }
      .dot[data-connection="offline"] {
        opacity: 0.42;
        filter: grayscale(0.85);
      }

      #label {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        max-width: 90%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.82);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
        pointer-events: none;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.86);
        }
        50% {
          transform: scale(0.9);
        }
      }

      @keyframes spin-pulse {
        0%,
        100% {
          transform: scale(0.92) rotate(0deg);
        }
        50% {
          transform: scale(1.02) rotate(180deg);
        }
      }

      @keyframes speak {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      @keyframes nudge {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot,
        .dot[data-activity] {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" data-tauri-drag-region>
      <div
        id="dot"
        class="dot"
        data-activity="idle"
        data-emotion="neutral"
        data-connection="online"
        data-tauri-drag-region
        role="img"
        aria-label="Doty is idle"
      ></div>
      <p id="label" data-tauri-drag-region></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
