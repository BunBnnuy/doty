[package]
name = "doty-harness"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# Live file tailing for the Codex JSONL rollouts.
notify = "8"
# CLI for the `doty-watch` binary.
clap = { version = "4", features = ["derive"] }
# Read-only SQLite adapters for OpenCode and T3.
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "doty-watch"
path = "src/main.rs"
